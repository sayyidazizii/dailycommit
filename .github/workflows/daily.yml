name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'     # 07:00 WIB
    - cron: '0 4 * * *'     # 11:00 WIB
    - cron: '0 10 * * *'    # 17:00 WIB
  workflow_dispatch:

jobs:
  update-and-commit:
    runs-on: ubuntu-latest

    env:
      ULTRA_MSG_INSTANCE_ID: ${{ secrets.ULTRA_MSG_INSTANCE_ID }}
      ULTRA_MSG_TOKEN: ${{ secrets.ULTRA_MSG_TOKEN }}
      WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
      _TOKEN: ${{ secrets.GITHUB_TOKEN }}
      _OWNER: ${{ secrets.GITHUB_OWNER }}
      _REPO: ${{ secrets.GITHUB_REPO }}
      _BASE_BRANCH: ${{ secrets.GITHUB_BASE_BRANCH }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run update script
      run: node bot.js
