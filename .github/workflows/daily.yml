name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'     # 07:00 WIB
    - cron: '0 4 * * *'     # 11:00 WIB
    - cron: '0 10 * * *'    # 17:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write  # <--- untuk membuat PR

jobs:
  update-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run bot script
      run: node bot.js
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
