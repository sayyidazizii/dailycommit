name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'     # 07:00 WIB
    - cron: '0 4 * * *'     # 11:00 WIB
    - cron: '0 10 * * *'    # 17:00 WIB
  workflow_dispatch:

jobs:
  update-and-commit:
    runs-on: ubuntu-latest
    env:
      ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
      INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
      PHONE_TARGET: ${{ secrets.PHONE_TARGET }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run update script
      run: node bot.js

    - name: Commit changes
      run: |
        git config user.name "sayyidazizii"
        git config user.email "sayyidsyafiq234@gmail.com"
        git add .
        git commit -m "Daily update" || echo "No changes to commit"

    - name: Push changes
      uses: ad-m/github-push-action@v0.8.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
